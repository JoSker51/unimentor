<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          sap: { DEFAULT: '#0A6ED1', dark: '#085CAD', light: '#E8F1FC', soft: '#F2F7FD' },
          ink: '#1D2D3E', muted: '#5B6B7B', line: '#E4E9EF', bg: '#F4F6F8'
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        boxShadow: {
          card: '0 1px 2px rgba(16,30,54,.04), 0 8px 24px rgba(16,30,54,.06)',

<style>
  *{scrollbar-width:thin;scrollbar-color:#cdd5df transparent}
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-thumb{background:#cdd5df;border-radius:9px}
  body{font-family:'Inter',sans-serif;background:#F4F6F8}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(10,110,209,.35)}70%{box-shadow:0 0 0 14px rgba(10,110,209,0)}100%{box-shadow:0 0 0 0 rgba(10,110,209,0)}}
  @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  @keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .anim-fade{animation:fadeUp .45s cubic-bezier(.2,.7,.3,1) both}
  .anim-pop{animation:pop .35s cubic-bezier(.2,.7,.3,1) both}
  .anim-slide{animation:slideIn .4s ease both}
  .anim-toast{animation:toastIn .35s cubic-bezier(.2,.7,.3,1) both}
  .ring-live{animation:pulseRing 2s infinite}
  .spin{animation:spin 1s linear infinite}
  .tx{transition:all .2s ease}
</style>
</head>

/* ----------------------------- UI Primitives ----------------------------- */
const cx = (...a) => a.filter(Boolean).join(' ');
const Card = ({className, children, ...p}) => <div {...p} className={cx('bg-white rounded-2xl border border-line shadow-card', className)}>{children}</div>;
const Btn = ({variant='primary', className, children, ...p}) => {
  const v = {
    primary:'bg-sap text-white hover:bg-sap-dark shadow-sm',
    soft:'bg-sap-light text-sap hover:bg-sap/15',
    ghost:'bg-transparent text-muted hover:bg-bg hover:text-ink',
    outline:'border border-line text-ink hover:border-sap hover:text-sap bg-white',
    danger:'bg-red-50 text-red-600 hover:bg-red-100',
    success:'bg-emerald-500 text-white hover:bg-emerald-600',
  }[variant];
  return <button {...p} className={cx('tx px-4 py-2.5 rounded-xl text-sm font-semibold inline-flex items-center justify-center gap-2 active:scale-[.97] disabled:opacity-50 disabled:pointer-events-none', v, className)}>{children}</button>;
};
const Pill = ({color='sap', children}) => {
  const c = { sap:'bg-sap-light text-sap', green:'bg-emerald-50 text-emerald-600', amber:'bg-amber-50 text-amber-600', red:'bg-red-50 text-red-600', gray:'bg-bg text-muted' }[color];
  return <span className={cx('px-2.5 py-1 rounded-lg text-[11px] font-bold tracking-wide', c)}>{children}</span>;
};
const Stars = ({n, s=14}) => (
  <span className="inline-flex items-center gap-.5 text-amber-400">
    {[1,2,3,4,5].map(i => <span key={i} className={i<=Math.round(n)?'opacity-100':'opacity-25'}>{React.cloneElement(Ic.star,{s})}</span>)}
  </span>
);
const Avatar = ({src, size=40, online}) => (
  <span className="relative inline-block shrink-0" style={{width:size,height:size}}>
    <img src={src} className="rounded-full object-cover w-full h-full ring-2 ring-white shadow-sm" alt=""/>

  </span>
);
const Progress = ({v, max=100, color='bg-sap'}) => (
  <div className="h-2.5 rounded-full bg-bg overflow-hidden w-full">
    <div className={cx('h-full rounded-full tx', color)} style={{width:`${Math.min(100,v/max*100)}%`}}/>
  </div>
);
const Field = ({label, children}) => (
  <label className="block">
    <span className="text-xs font-semibold text-muted mb-1.5 block">{label}</span>
    {children}
  </label>
);
const inputCls = "w-full px-3.5 py-2.5 rounded-xl border border-line bg-white text-sm text-ink placeholder-gray-400 focus:border-sap focus:ring-2 focus:ring-sap/15 outline-none tx";

/* ----------------------------- App Context ----------------------------- */
const App = createContext();
const useApp = () => useContext(App);

/* ----------------------------- Toasts ----------------------------- */
function Toasts({ items }) {
  return (
    <div className="fixed top-5 right-5 z-[100] space-y-2 w-80 max-w-[90vw]">
      {items.map(t=>(
        <div key={t.id} className="anim-toast bg-white border border-line shadow-float rounded-xl p-3.5 flex items-start gap-3">
          <span className={cx('w-8 h-8 rounded-lg grid place-items-center shrink-0 text-white',
            t.type==='error'?'bg-red-500':t.type==='info'?'bg-sap':'bg-emerald-500')}>
            {React.cloneElement(t.type==='error'?Ic.x:t.type==='info'?Ic.bell:Ic.check,{s:16})}
          </span>
          <div className="text-sm text-ink leading-snug">{t.msg}</div>
        </div>
      ))}
    </div>
  );
}

/* ----------------------------- Auth Screen ----------------------------- */

          <div className="mt-8 flex gap-8">

        <Card className="w-full max-w-md p-8 anim-pop">

            <div className="w-9 h-9 rounded-xl bg-sap text-white grid place-items-center font-extrabold">U</div>

              {mode==='login'?'Regístrate':'Inicia sesión'}
            </button>
          </p>
        </Card>

/* ----------------------------- Shell (Sidebar + Topbar) ----------------------------- */

    ['mdash','Inicio',Ic.grid],['mrequests','Solicitudes',Ic.inbox],['chat','Mensajes',Ic.chat],

  const me = role==='student'
    ? { name:'Juan Pérez', tag:'Estudiante · 2º Sem', img:AV(60) }
    : { name:'Valentina Rojas', tag:'Mentor · 8º Sem', img:AV(47) };
  return (
    <div className="min-h-screen flex bg-bg text-ink">
      {open && <div onClick={()=>setOpen(false)} className="fixed inset-0 bg-ink/40 z-30 lg:hidden"/>}
      <aside className={cx('w-64 shrink-0 bg-white border-r border-line flex flex-col fixed h-screen z-40 tx',

    { who:'them', t:'Perfecto. Eso da 0/0, así que factorizamos el numerador: x²-4 = (x-2)(x+2). Te comparto pantalla y lo vemos paso a paso.', ts:'4:03 PM' },
    { who:'me', t:'¡Ahí sí lo veo! Entonces se cancela (x-2) y queda x+2 → 4', ts:'4:05 PM' },
    { who:'them', t:'¡Exacto! 🎉 Ese es el método de factorización. Ahora hagamos uno con L\'Hôpital para que compares.', ts:'4:06 PM' },
  ]);
  const [val, setVal] = useState('');
  const [time, setTime] = useState(372);
  const [sharing, setSharing] = useState(false);
  const [ending, setEnding] = useState(false);
  const fileRef = useRef();
  const endRef = useRef();
  useEffect(()=>{ const t=setInterval(()=>setTime(s=>s+1),1000); return ()=>clearInterval(t); },[]);
  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs]);
  const now = () => new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
  const send = () => { if(!val.trim())return; setMsgs(m=>[...m,{who:'me',t:val,ts:now()}]); setVal('');
    setTimeout(()=>setMsgs(m=>[...m,{who:'them',t:'¡Buena pregunta! Déjame mostrarte con un ejemplo.',ts:now()}]),1200); };
  const onFile = e => { const file=e.target.files?.[0]; if(!file)return;
    setMsgs(m=>[...m,{who:'me',file:file.name,ts:now()}]); toast('Archivo compartido en el chat'); e.target.value=''; };
  const toggleShare = () => { setSharing(s=>!s); toast(sharing?'Dejaste de compartir pantalla':'Compartiendo pantalla','info'); };
  const finish = (rating) => {
    const mm=Math.floor(time/60), dur = mm>=60?`${Math.floor(mm/60)}h ${mm%60}min`:`${mm} min`;
    addSession({ with:p.name, subject:p.subject, date:'18 May 2026', dur, rating, status:'Completada' });
    toast('Sesión finalizada y guardada en tu historial');
    go('history');
  };
  const mm = String(Math.floor(time/60)).padStart(2,'0'), ss = String(time%60).padStart(2,'0');
  return (
    <div className="-m-4 sm:-m-7 h-[calc(100vh-4rem)] flex">
      <div className="flex-1 flex flex-col min-w-0">
        <div className="min-h-16 py-2 bg-white border-b border-line flex flex-wrap items-center justify-between gap-2 px-4 sm:px-6">
          <div className="flex items-center gap-3">
            <button onClick={()=>go(role==='mentor'?'mrequests':'matching')} className="text-muted hover:text-ink tx">{Ic.back}</button>
            <Avatar src={p.img} size={42} online/>
            <div><div className="font-bold leading-none">{p.name}</div><div className="text-xs text-emerald-600 mt-1 font-medium">● En línea · {p.subject}</div></div>
          </div>
          <div className="flex items-center gap-2">
            <span className="px-3 py-1.5 rounded-xl bg-sap-light text-sap text-sm font-bold flex items-center gap-1.5">{React.cloneElement(Ic.clock,{s:15})} {mm}:{ss}</span>
            <Btn variant={sharing?'success':'outline'} className="!px-3" onClick={toggleShare}>{React.cloneElement(Ic.screen,{s:16})} <span className="hidden sm:inline">{sharing?'Compartiendo':'Pantalla'}</span></Btn>
            <Btn variant="danger" className="!px-3" onClick={()=>setEnding(true)}>{React.cloneElement(Ic.phoneOff,{s:16})} <span className="hidden sm:inline">Finalizar</span></Btn>
          </div>
        </div>
        {sharing && <div className="bg-emerald-50 text-emerald-700 text-xs font-semibold px-6 py-2 flex items-center gap-2 border-b border-emerald-100">{React.cloneElement(Ic.screen,{s:14})} Estás compartiendo tu pantalla con {p.name.split(' ')[0]}</div>}
        <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 bg-bg">
          <div className="text-center"><span className="text-xs text-muted bg-white px-3 py-1 rounded-full border border-line">Sesión iniciada · Hoy 4:00 PM</span></div>
          {msgs.map((x,i)=>(
            <div key={i} className={cx('flex anim-fade', x.who==='me'?'justify-end':'justify-start')}>
              <div className="flex items-end gap-2 max-w-[78%]">
                {x.who==='them' && <Avatar src={p.img} size={28}/>}
                <div>
                  {x.file
                    ? <div className={cx('px-4 py-3 rounded-2xl text-sm flex items-center gap-2.5', x.who==='me'?'bg-sap text-white rounded-br-md':'bg-white border border-line rounded-bl-md')}>
                        {React.cloneElement(Ic.file,{s:18})}<span className="font-semibold">{x.file}</span></div>
                    : <div className={cx('px-4 py-2.5 rounded-2xl text-sm leading-relaxed', x.who==='me'?'bg-sap text-white rounded-br-md':'bg-white border border-line rounded-bl-md')}>{x.t}</div>}
                  <div className={cx('text-[10px] text-muted mt-1', x.who==='me'?'text-right':'')}>{x.ts}</div>
                </div>
              </div>
            </div>
          ))}
          <div ref={endRef}/>
        </div>
        <div className="bg-white border-t border-line p-3 sm:p-4 flex items-center gap-2">
          <input type="file" ref={fileRef} onChange={onFile} className="hidden"/>
          <button onClick={()=>fileRef.current.click()} className="w-10 h-10 rounded-xl hover:bg-bg text-muted grid place-items-center tx" title="Adjuntar archivo">{Ic.paperclip}</button>
          <input value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Escribe un mensaje…" className="flex-1 px-4 py-2.5 rounded-xl bg-bg border border-transparent focus:bg-white focus:border-sap outline-none text-sm tx"/>
          <Btn onClick={send} className="!px-4">{Ic.send}</Btn>
        </div>
      </div>
      <aside className="w-80 bg-white border-l border-line p-5 overflow-y-auto hidden xl:block">
        <h3 className="font-bold mb-4">Panel de sesión</h3>
        <div className="rounded-xl bg-sap-soft border border-sap/15 p-4 mb-5">
          <div className="text-xs text-muted">Materia</div><div className="font-bold">{p.subject}</div>
          <div className="text-xs text-muted mt-2">Duración</div><div className="font-bold">{mm}:{ss} min</div>
        </div>
        {[
          ['Temas tratados',[ 'Forma indeterminada 0/0','Factorización de polinomios',"Regla de L'Hôpital",'Continuidad de funciones']],
          ['Recursos compartidos',['📄 Guía_limites.pdf','🔗 Video: límites en 10 min','📊 Tabla de equivalencias']],

          </div>
        ))}
      </aside>
      {ending && <EndSessionModal peer={p} dur={`${mm}:${ss} min`} onClose={()=>setEnding(false)} onConfirm={finish}/>}

  );
}

          <div className="flex flex-wrap gap-2">
            {subjects.map(s=>(
              <button key={s} onClick={()=>setSubjects(x=>x.filter(i=>i!==s))} className="px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 bg-sap text-white tx">{s}{React.cloneElement(Ic.x,{s:12})}</button>
            ))}
          </div>
          {subjects.length<7 && <div className="mt-4">
            <div className="text-xs font-semibold text-muted mb-2">Sugeridas</div>
            <div className="flex flex-wrap gap-2">
              {pool.filter(p=>!subjects.includes(p)).map(p=>(
                <button key={p} onClick={()=>setSubjects(x=>[...x,p])} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-bg text-muted hover:bg-sap-light hover:text-sap tx flex items-center gap-1.5">{React.cloneElement(Ic.plus,{s:12})}{p}</button>
              ))}
            </div>
          </div>}
          <div className="mt-6 rounded-xl bg-amber-50 p-4 text-amber-700 text-xs">Mientras más materias y horas, más puntos y recompensas acumulas.</div>
        </Card>
      </div>
    </>
  );
}

/* ----------------------------- Settings ----------------------------- */
function Settings() {
  const { role, toast, logout } = useApp();
  const me = role==='student' ? {n:'Juan Pérez',c:'Ing. de Sistemas — 2º semestre',img:AV(60)} : {n:'Valentina Rojas',c:'Ing. de Sistemas — 8º semestre',img:AV(47)};
  return (
    <>
      <PageHead title="Configuración de perfil" sub="Administra tu información y preferencias."/>
      <div className="grid lg:grid-cols-3 gap-5">
        <Card className="lg:col-span-2 p-6 anim-fade space-y-4">
          <div className="flex flex-wrap items-center gap-4 pb-5 border-b border-line">
            <Avatar src={me.img} size={72}/>
            <div><div className="font-bold">{me.n}</div><div className="text-sm text-muted">{me.c}</div></div>
            <Btn variant="outline" className="ml-auto" onClick={()=>toast('Función de foto disponible en producción','info')}>Cambiar foto</Btn>
          </div>
          <div className="grid sm:grid-cols-2 gap-4">
            <Field label="Nombre"><input className={inputCls} defaultValue={me.n}/></Field>
            <Field label="Correo institucional"><input className={inputCls} defaultValue="usuario@universidad.edu.co"/></Field>
            <Field label="Carrera"><input className={inputCls} defaultValue="Ingeniería de Sistemas"/></Field>
            <Field label="Semestre"><input className={inputCls} defaultValue={role==='student'?'2':'8'}/></Field>
          </div>
          <Field label="Sobre mí"><textarea rows="3" className={inputCls} defaultValue="Apasionado por aprender y ayudar a otros a lograr su mejor versión académica."/></Field>
          <Btn onClick={()=>toast('Cambios guardados correctamente')}>{Ic.check} Guardar cambios</Btn>
        </Card>
        <Card className="p-6 anim-fade h-fit">
          <h3 className="font-bold mb-4">Preferencias</h3>
          {[['Notificaciones push',true],['Alertas de solicitudes',true],['Resumen semanal por correo',false],['Mostrar estado en línea',true]].map(([t,d])=>(
            <div key={t} className="flex items-center justify-between py-3 border-b border-line last:border-0">
              <span className="text-sm">{t}</span>
              <Toggle def={d}/>
            </div>
          ))}
          <Btn variant="danger" className="w-full mt-6" onClick={logout}>{Ic.logout} Cerrar sesión</Btn>
        </Card>
      </div>
    </>
  );
}
function Toggle({def}) {
  const [on,setOn]=useState(def);
  return <button onClick={()=>setOn(!on)} className={cx('w-12 h-7 rounded-full tx relative', on?'bg-sap':'bg-gray-300')}><span className={cx('absolute top-1 w-5 h-5 rounded-full bg-white tx shadow', on?'left-6':'left-1')}/></button>;
}

/* ----------------------------- Router ----------------------------- */
function Root() {
  const [auth, setAuth] = useState(false);
  const [role, setRole] = useState('student');
  const [screen, setScreen] = useState('dash');
  const [req, setReq] = useState(null);
  const [peer, setPeer] = useState(null);
  const [sessions, setSessions] = useState([]);
  const [toasts, setToasts] = useState([]);
  const toast = (msg, type='success') => {
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3400);
  };
  const ctx = {
    role, screen, req, peer, sessions,
    login:(r)=>{ setRole(r); setScreen(r==='student'?'dash':'mdash'); setAuth(true); },
    logout:()=>{ setAuth(false); setReq(null); setPeer(null); setSessions([]); setScreen('dash'); },
    go:setScreen,
    setReq,
    openChatWith:(p)=>{ setPeer(p); setScreen('chat'); },
    addSession:(s)=>setSessions(x=>[{...s,id:Date.now()},...x]),
    toast,
  };
  if (!auth) return <App.Provider value={ctx}><Auth/><Toasts items={toasts}/></App.Provider>;
  const screens = {
    dash:<StudentDash/>, request:<RequestForm/>, matching:<Matching/>, chat:<Chat/>,
    history:<History/>, profile:<StudentProfile/>, settings:<Settings/>,
    mdash:<MentorDash/>, mrequests:<MentorRequests/>, incentives:<Incentives/>, availability:<Availability/>,
  };
  return (
    <App.Provider value={ctx}>
      <Shell>{screens[screen] || (role==='student'?<StudentDash/>:<MentorDash/>)}</Shell>
      <Toasts items={toasts}/>
    </App.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
